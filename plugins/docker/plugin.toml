id = "docker"
name = "Docker"
version = "0.2.0"
description = "A live panel listing running containers, with a stats shortcut"

# `process` runs the docker CLI; `commands` opens `docker stats` in a tab.
capabilities = ["process", "commands"]

[runtime]
type = "wasm"
wasm = "plugin.wasm"

[panel]
id = "docker"
title = "Docker"
icon = "❑"

[[tool]]
id = "containers"
description = "Every container with its name, image, status, and whether it is running. Returns structured JSON."
